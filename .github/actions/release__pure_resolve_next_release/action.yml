name: 'release__pure_resolve_next_release'
description: 'Pure function: resolves next SemVer version and release notes from git tags and CHANGELOG'
inputs:
  raw_tags:
    description: 'Raw git tags output (one tag per line, sorted by -v:refname)'
    required: true
  changelog_text:
    description: 'Content of CHANGELOG.md file (or empty string)'
    required: true
  commits:
    description: 'Git commit messages (one per line, from git log --pretty=format:%s)'
    required: true
    default: ''
outputs:
  version:
    value: ${{ steps.resolve.outputs.version }}
  release_notes:
    value: ${{ steps.resolve.outputs.release_notes }}
runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      run: python3 "${{ github.action_path }}/pure.py"
      env:
        INPUT_RAW_TAGS: ${{ inputs.raw_tags }}
        INPUT_CHANGELOG_TEXT: ${{ inputs.changelog_text }}
        INPUT_COMMITS: ${{ inputs.commits }}
