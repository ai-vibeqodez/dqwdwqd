name: 'resolve_next_release'
description: 'Resolves next SemVer version and release notes from git history and CHANGELOG.md'
outputs:
  version:
    value: ${{ steps.resolve.outputs.version }}
  release_notes:
    value: ${{ steps.resolve.outputs.release_notes }}
runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      run: python3 "${{ github.action_path }}/main.py"
