name: on_wfd__release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  resolve_version:
    uses: ai-vibeqodez/dqwdwqd/.github/workflows/reusable__release__resolve_version.yml@main

  build:
    needs: resolve_version
    uses: ai-vibeqodez/dqwdwqd/.github/workflows/reusable__common__build_cpp23.yml@main
    with:
      upload_artifacts: false
      new_version_number: ${{ needs.resolve_version.outputs.version }}

  sanitizers:
    needs: resolve_version
    uses: ai-vibeqodez/dqwdwqd/.github/workflows/reusable__common__sanitizers_cpp23.yml@main

  publish:
    needs: [resolve_version, build, sanitizers]
    uses: ai-vibeqodez/dqwdwqd/.github/workflows/reusable__release__publish.yml@main
    with:
      version: ${{ needs.resolve_version.outputs.version }}
      release_notes: ${{ needs.resolve_version.outputs.release_notes }}
      release_notes_footer: |
        ### 📦 Header
        ** List Title:**
        - List Item `1`
        - List Item `2`

        **Code example:**

        ```json
        {
          "LogLevel": "info"
        }
        ```

        See [README.md](https://github.com/ai-warevo/) for full documentation.
