name: reusable-resolve-version

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.resolve.outputs.version }}
      release_notes:
        value: ${{ jobs.resolve.outputs.release_notes }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - id: resolve
        uses: ai-vibeqodez/dqwdwqd/.github/actions/release__resolve_next_release_io@main
