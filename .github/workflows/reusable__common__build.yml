name: reusable__release__resolve_version

on:
  workflow_call:
    inputs:
      lint_cmd:
        type: string
        required: false
        default: 'make lint'
        description: 'todo:: FIXME'
      build_cmd:
        type: string
        required: false
        default: 'make build'
        description: 'todo:: FIXME'
      test_cmd:
        type: string
        required: false
        default: 'make test'
        description: 'todo:: FIXME'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lint
        run: ${{ inputs.lint_cmd }}

      - name: build
        run: ${{ inputs.build_cmd }}

      - name: test
        run: ${{ inputs.test_cmd }}

      - uses: actions/upload-artifact@v4
        with:
          name: central-build
          path: dist/
