name: on_pr__main

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Makefile'
      - '.editorconfig'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/**'

jobs:
  build:
    uses: ai-vibeqodez/dqwdwqd/.github/workflows/reusable__common__build_cpp23.yml@main
    with:
      upload_artifacts: false

  coverage:
    uses: ai-vibeqodez/dqwdwqd/.github/workflows/reusable__common__coverage_cpp23.yml@main
    with:
      min_coverage: 60
      deploy_pages: false
      deploy_badge: false
