name: reusable-release

on:
  workflow_call:

jobs:
  resolve_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: resolve
        uses: ai-vibeqodez/dqwdwqd/.github/actions/resolve_next_release@main

  build:
    needs: resolve_version
    runs-on: ubuntu-latest
    steps:
      - name: Build Project (Stub)
        run: |
          echo "Building version ${{ needs.resolve_version.outputs.version }}"
          mkdir -p dist
          echo "dummy binary" > dist/app-linux-x64.bin

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  publish:
    needs: [resolve_version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update VERSION and CHANGELOG.md
        uses: ai-vibeqodez/dqwdwqd/.github/actions/write_release_files@main
        with:
          version: ${{ needs.resolve_version.outputs.version }}
          release_notes: ${{ needs.resolve_version.outputs.release_notes }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/

      - name: Commit, Tag, Push & Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve_version.outputs.version }}
          RELEASE_NOTES: ${{ needs.resolve_version.outputs.release_notes }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add VERSION CHANGELOG.md
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(release): ${VERSION}"
          fi

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD --follow-tags

          gh release create "v${VERSION}" dist/* --title "v${VERSION}" --notes "$RELEASE_NOTES"
